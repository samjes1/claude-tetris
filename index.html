<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo claro">
    <span class="theme-label">Modo claro</span>
    <span class="switch"></span>
  </button>
  <label class="skin-picker" for="skin-select">
    <span class="skin-label">Skin</span>
    <select id="skin-select">
      <option value="retro">Retro</option>
      <option value="neon">Neon</option>
      <option value="pastel">Pastel</option>
      <option value="pixel">Pixel art</option>
    </select>
  </label>
  <div class="app">
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd>/<kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <div class="overlay-box pause-box">
        <p id="pause-title">PAUSA</p>
        <button type="button" id="resume-btn" class="menu-btn primary">Reanudar</button>
        <button type="button" id="pause-restart-btn" class="menu-btn">Reiniciar</button>
        <button type="button" id="controls-btn" class="menu-btn" aria-expanded="false" aria-controls="pause-controls">Ver controles</button>
        <ul id="pause-controls" class="pause-controls hidden">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd>/<kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd>/<kbd>Esc</kbd> pausa</li>
        </ul>
        <label class="level-select" for="start-level">
          Nivel inicial
          <select id="start-level"></select>
        </label>
        <p class="pause-hint">Se aplica al reiniciar</p>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="name-entry" class="name-entry hidden">
          <p id="new-record-msg" class="new-record"></p>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" spellcheck="false" />
            <button id="save-btn" type="button" class="small-btn">Guardar</button>
          </div>
        </div>
        <div id="overlay-records" class="records hidden"></div>
        <button id="restart-btn">Reiniciar</button>
        <button id="overlay-reset-btn" type="button" class="link-btn reset-records hidden">Borrar records</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p class="start-title">RECORDS</p>
        <div id="start-records" class="records"></div>
        <button id="play-btn" type="button">Jugar</button>
        <button id="start-reset-btn" type="button" class="link-btn reset-records">Borrar records</button>
      </div>
    </div>
  </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
