name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--allowedTools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Read,Write,Glob,Grep"'
          prompt: |
            Eres un asistente de triage para el repositorio ${{ github.repository }}.
            Analiza el issue #${{ github.event.issue.number }} (evento: ${{ github.event.action }}).

            Pasos:
            1. Lee el issue: `gh issue view ${{ github.event.issue.number }} --json title,body,labels,comments`
            2. Lista los labels disponibles: `gh label list --limit 100`
               - Elige SOLO labels de esa lista. NUNCA crees labels nuevos.
               - Aplica los que correspondan: `gh issue edit ${{ github.event.issue.number }} --add-label "a,b"`
               - Si el evento es "edited" y un label previo ya no aplica, quítalo con `--remove-label`.
               - Si ningún label encaja, no fuerces ninguno.
            3. Explora el código del repositorio (Read, Glob, Grep) para ubicar la causa probable y los archivos afectados.
            4. Escribe el diagnóstico en el archivo /tmp/triage.md y publícalo con:
               `gh issue comment ${{ github.event.issue.number }} --edit-last --create-if-none --body-file /tmp/triage.md`
               (esto crea el comentario la primera vez y lo actualiza en ediciones posteriores).

            IMPORTANTE: el comentario DEBE estar en Markdown válido de GitHub (GFM) para que se renderice correctamente:
            - Usa encabezados `##`/`###`, **negritas**, listas con `-`, y `código` inline con backticks.
            - Deja una línea en blanco entre cada sección/párrafo (sin ella GitHub une las líneas en un solo párrafo).
            - Bloques de código con triple backtick y lenguaje (```js).
            - Referencias a archivos como `archivo:línea`. No uses HTML ni texto plano sin formato.

            Formato del diagnóstico (en español, Markdown):
            ## 🔍 Diagnóstico automático (Claude)
            **Resumen:** qué pide o reporta el issue, en 1-3 frases.
            **Tipo / labels asignados:** labels aplicados y justificación breve.
            **Causa probable:** análisis técnico con referencias `archivo:línea`.
            **Archivos afectados:** lista.
            **Enfoque de solución sugerido:** pasos concretos para implementarlo (sin escribir el código completo).
            **Preguntas abiertas / información faltante:** lo que haría falta aclarar, o "Ninguna".
            ---
            _Actualizado tras evento: ${{ github.event.action }}_

            Restricciones: no modifiques código del repositorio, no abras PRs, no cierres ni reasignes el issue.
